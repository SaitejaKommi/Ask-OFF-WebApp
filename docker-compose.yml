services:
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: askoff-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q '\"cluster_name\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - askoff-os-data:/usr/share/opensearch/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askoff-api
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - ASKOFF_RAW_DATA_PATH=data/raw/normalized.parquet
      - ASKOFF_OPENSEARCH_INDEX=askoff_products
      - ASKOFF_OPENSEARCH_HOST=opensearch
      - ASKOFF_OPENSEARCH_PORT=9200
    ports:
      - "8000:8000"

volumes:
  askoff-os-data: